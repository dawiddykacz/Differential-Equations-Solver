name: Deploy Differential-Equations-Solver

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS and Run HeatmapScript
        run: |
         ssh -o StrictHostKeyChecking=no \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

            set -e
            cd /home/python/Differential-Equations-Solver

            BRANCH="${{ github.ref_name }}"
            echo "▶ Deploying branch: $BRANCH"
            git fetch origin
            git checkout $BRANCH
            git reset --hard origin/$BRANCH

            echo "▶ Stating Solver - HeatmapScript.py"
            mkdir -p plot
          
            docker compose build

            docker compose run --rm ai-solver python HeatmapScript.py

         EOF